name: Sync diario Biwenger

on:
  schedule:
    # 08:00 Europe/Madrid en verano (CEST = UTC+2). En invierno (CET) son las 07:00.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Sincronizar liga
        env:
          BIWENGER_EMAIL: ${{ secrets.BIWENGER_EMAIL }}
          BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
          BIWENGER_LEAGUE: ${{ secrets.BIWENGER_LEAGUE }}
        run: python sync_biwenger.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/liga.json web/data/liga.json
          if git diff --staged --quiet; then
            echo "Sin cambios en liga.json"
          else
            git commit -m "Actualiza datos liga"
            git push
          fi

      # El push con GITHUB_TOKEN no dispara pages.yml (limitación de GitHub),
      # así que desplegamos aquí tras el sync diario.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
